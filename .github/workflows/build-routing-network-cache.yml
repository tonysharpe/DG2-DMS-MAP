name: Build routing network cache

on:
  workflow_dispatch:
  push:
    paths:
      - "data/roads.geojson"
      - "data/junctions.geojson"
      - "data/gates.geojson"
      - "data/destinations.geojson"
      - "data/meta.json"
      - "js/app.js"
      - "scripts/build-routing-network-cache.js"
      - ".github/workflows/build-routing-network-cache.yml"

permissions:
  contents: write

concurrency:
  group: routing-network-cache
  cancel-in-progress: false

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the app
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/routing-cache-server.log 2>&1 &
          echo $! > /tmp/routing-cache-server.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/routing-cache-server.log
          exit 1

      - name: Generate routing networks
        run: node scripts/build-routing-network-cache.js

      - name: Commit generated network
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routing-network-cache.json
          if git diff --cached --quiet; then
            echo "Generated routing network is unchanged."
            exit 0
          fi
          git commit -m "Build routing network cache [skip ci]"
          git push origin HEAD:main
