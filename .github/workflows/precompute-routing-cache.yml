name: Precompute vehicle routing networks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/app.js"
      - "js/routing.js"
      - "js/main.js"
      - "index.html"
      - "data/*.geojson"
      - "data/*.json"
      - "!data/routing-network-cache.json"
      - "scripts/generate-routing-cache.mjs"
      - ".github/workflows/precompute-routing-cache.yml"

permissions:
  contents: write

concurrency:
  group: precompute-routing-cache
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate all six vehicle networks
        run: node scripts/generate-routing-cache.mjs

      - name: Commit updated routing cache
        run: |
          if [ -z "$(git status --porcelain -- data/routing-networks/)" ]; then
            echo "Per-vehicle routing caches are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routing-networks/*.json
          git commit -m "Precompute per-vehicle routing networks"
          git push origin main
