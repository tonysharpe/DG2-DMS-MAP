<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="LAAR destination search and vehicle-specific site routing."
  >

  <meta
    name="theme-color"
    content="#FFFFFF"
  >

  <title>Diriyah 2 Map</title>


  <!-- STYLESHEETS -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="style.css?v=map-loading-dialog-1"
  >
<!-- LIBRARIES -->

  <script
    defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"
  ></script>


  <!-- APPLICATION: LOAD EACH SCRIPT ONCE -->

  <script
    defer
    src="js/app.js?v=auto-route-ui-1"
  ></script>
<script
    defer
    src="js/location.js?v=recenter-left-2"
  ></script>

  <script
    defer
    src="js/routing.js?v=project-structure-1"
  ></script>

  <script
    defer
    src="js/mapLayers.js?v=central-theme-1"
  ></script>

  <script defer src="js/routeDisplay.js?v=auto-route-ui-1"></script>
  <script defer src="js/map.js?v=auto-route-ui-1"></script>
</head>

<body>

  <div id="mapLoadingDialog" class="map-loading-dialog" role="status" aria-live="polite">
    <span class="map-loading-dialog__spinner" aria-hidden="true"></span>
    <span>Map Loading...</span>
  </div>


  <aside id="navigationPanel" aria-label="Navigation controls">

    <!-- HEADER -->

    <header class="site-header">
      <h1>Diriyah 2 Map</h1>
      <button id="panelToggle" class="mobile-panel-toggle" type="button" aria-expanded="false" aria-controls="navigationPanel">Plan route</button>
    </header>
<!-- VEHICLE -->
    <section class="control-section" aria-labelledby="vehicleHeading">
      <h2 id="vehicleHeading">Vehicle Type:</h2>
      <select id="vehicleType" hidden disabled aria-hidden="true" tabindex="-1">
        <option value="truck" selected>Truck</option>
        <option value="bus">Bus</option>
        <option value="minibus">Mini Bus</option>
        <option value="pickup">Pick-up</option>
        <option value="suv">SUV</option>
        <option value="car">Car</option>
      </select>
      <fieldset class="radio-options vehicle-options" aria-label="Vehicle type">
        <legend class="visually-hidden">Vehicle type</legend>
        <label><input type="radio" name="vehicleTypeChoice" value="truck" checked> Truck</label>
        <label><input type="radio" name="vehicleTypeChoice" value="bus"> Bus</label>
        <label><input type="radio" name="vehicleTypeChoice" value="minibus"> Mini Bus</label>
        <label><input type="radio" name="vehicleTypeChoice" value="pickup"> Pick-up</label>
        <label><input type="radio" name="vehicleTypeChoice" value="suv"> SUV</label>
        <label><input type="radio" name="vehicleTypeChoice" value="car"> Car</label>
      </fieldset>
    </section>

    <!-- START LOCATION -->
    <section class="control-section" aria-labelledby="startingHeading">
      <h2 id="startingHeading">Site location</h2>
      <fieldset class="radio-options start-options" aria-label="Start location">
        <legend class="visually-hidden">Start location</legend>
        <label><input type="radio" name="startModeChoice" value="gate" checked> Access Gate</label>
        <label><input type="radio" name="startModeChoice" value="live"> Current Location</label>
        <label><input type="radio" name="startModeChoice" value="map"> Set on Map</label>
      </fieldset>
      <select id="startMode" hidden disabled aria-hidden="true" tabindex="-1">
        <option value="gate" selected>Access Gate</option>
        <option value="live">Current Location</option>
        <option value="map">Set on Map</option>
      </select>
    </section>

    <!-- DESTINATION -->
    <section class="control-section" aria-labelledby="destinationHeading">
      <h2 id="destinationHeading">Destination</h2>
      <fieldset class="radio-options destination-type-options" aria-label="Destination type">
        <legend class="visually-hidden">Destination type</legend>
        <label><input type="radio" name="destinationType" value="WAN"> WAN</label>
        <label><input type="radio" name="destinationType" value="LAAR" checked> LAAR</label>
        <label><input type="radio" name="destinationType" value="Office"> Office</label>
      </fieldset>
      <label for="destinationSearch">Find destination</label>
      <input id="destinationSearch" type="search" placeholder="Type to search…" autocomplete="off"
        aria-describedby="searchStatus" disabled>
      <p id="searchStatus" class="field-help" aria-live="polite"></p>
      <label for="end">Available destinations</label>
      <select id="end" disabled>
        <option value="" selected>Select destination…</option>
      </select>
    </section>


    <!-- ROUTE SUMMARY -->

    <section
      id="routeSummary"
      class="route-summary"
      aria-labelledby="routeSummaryHeading"
      aria-live="polite"
      hidden
    >
      <h2 id="routeSummaryHeading">
        Route
      </h2>

      <div
        id="summaryDestination"
        class="summary-destination"
      ></div>

      <p class="summary-start">
        From <span id="summaryStart"></span>
      </p>

      <div class="summary-metrics">
        <div>
          <span class="metric-label">
            Distance
          </span>

          <span
            id="summaryDistance"
            class="metric-value"
          ></span>
        </div>

        <div>
          <span class="metric-label">
            Est. time
          </span>

          <span
            id="summaryTime"
            class="metric-value"
          ></span>
        </div>
      </div>

      <details class="route-details">
        <summary>
          Details
        </summary>

        <p id="routeDetails"></p>
      </details>
    </section>


    <!-- SHARE -->

    <section
      class="control-section share-section"
      aria-labelledby="shareHeading"
    >
      <h2 id="shareHeading">
        Share
      </h2>

      <button
        id="copyLink"
        type="button"
        disabled
      >
        Copy link
      </button>

      <p
        id="shareStatus"
        class="field-help"
        role="status"
        aria-live="polite"
      >
        Select a LAAR.
      </p>

      <div id="shareFallback" hidden>
        <label for="shareLink">
          Link
        </label>

        <input
          id="shareLink"
          type="text"
          readonly
        >
      </div>
    </section>


    <!-- GENERAL CONTROLS -->

    <div class="button-row">
      <button
        id="clear"
        type="button"
        disabled
      >
        Clear
      </button>

      <button
        id="fit"
        type="button"
        disabled
      >
        Whole site
      </button>
    </div>


    <span id="networkDate" hidden></span>

    <!-- STATUS -->

    <p
      id="status"
      class="setup-status"
      role="status"
      aria-live="polite"
    >
      Loading…
    </p>



      <label for="start">Selected gate</label>
      <select id="start" disabled></select>
      <div class="button-row">
        <button id="locate" type="button" disabled>Locate me</button>
        <button id="stopLocation" type="button" disabled>Stop</button>
      </div>
      <p id="locationStatus" class="location-status" role="status" aria-live="polite">Location off.</p>

    <noscript>
      <p class="setup-status">
        Enable JavaScript to use navigation.
      </p>
    </noscript>

  </aside>


  <!-- MAP -->

  <main
    id="map"
    aria-label="Interactive LAAR navigation map"
  ></main>


  <script defer src="js/ui.js?v=auto-route-ui-1"></script>
  <script defer src="js/main.js?v=project-structure-1"></script>

</body>
</html>
