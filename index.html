<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="LAAR destination search and vehicle-specific site routing."
  >

  <meta
    name="theme-color"
    content="#FFFFFF"
  >

  <title>Diriyah 2 Map</title>


  <!-- STYLESHEETS -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="style.css?v=map-and-routes-loading-2"
  >
<!-- LIBRARIES -->

  <script
    defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"
  ></script>


  <!-- APPLICATION: LOAD EACH SCRIPT ONCE -->

  <!-- Shared classic-script namespace: preserve this dependency order.
       main.js checks required globals before starting the application. -->
  <script defer src="script/app.js?v=mobile-zoom-20-1"></script>
  <script defer src="script/location.js?v=cleanup-20261116-1"></script>
  <script defer src="script/routeDisplay.js?v=cleanup-20261116-1"></script>
  <script defer src="script/map.js?v=main-refactor-20261115"></script>
  <script defer src="script/routing.js?v=main-refactor-20261115"></script>
  <script defer src="script/mapLayers.js?v=cleanup-20261116-1"></script>
</head>

<body>

  <div id="mapLoadingDialog" class="map-loading-dialog" role="status" aria-live="polite">
    <span class="map-loading-dialog__spinner" aria-hidden="true"></span>
    <span>Map Loading...</span>
  </div>
  <div id="routesLoadingDialog" class="map-loading-dialog routes-loading-dialog" role="status" aria-live="polite" hidden>
    <span class="map-loading-dialog__spinner" aria-hidden="true"></span>
    <span>Routes Loading...</span>
  </div>

  <aside id="navigationPanel" aria-label="Navigation controls">

    <!-- HEADER -->

    <header class="site-header">
      <h1>Diriyah 2 Map</h1>
      <div id="mobileHeaderSummary" class="mobile-header-summary" aria-live="polite">
        <span id="mobileHeaderVehicleIcon" class="mobile-header-summary__vehicle-icon" aria-hidden="true"></span>
        <span id="mobileHeaderDestination">No Route Selected</span>
      </div>
      <div class="header-actions"><button id="panelToggle" class="mobile-panel-toggle" type="button" aria-expanded="true" aria-controls="navigationPanel">Hide</button><button id="liveRouteToggle" class="live-route-toggle" type="button" disabled>Start</button></div>
    </header>
<!-- VEHICLE -->
    <section class="control-section" aria-labelledby="vehicleHeading">
      <h2 id="vehicleHeading">Vehicle Type:</h2>
      <select id="vehicleType" hidden disabled aria-hidden="true" tabindex="-1">
        <option value="truck" selected>Truck</option>
        <option value="concrete">Concrete</option>
        <option value="tanker">Tanker</option>
        <option value="pickup">Pick-up</option>
        <option value="bus">Bus</option>
        <option value="minibus">Mini Bus</option>
        <option value="suv">Site Car</option>
        <option value="car">Private Car</option>
      </select>
      <fieldset class="radio-options vehicle-options" aria-label="Vehicle type">
        <legend class="visually-hidden">Vehicle type</legend>
        <label title="Truck" aria-label="Truck">
          <input type="radio" name="vehicleTypeChoice" value="truck" checked>
          <img class="vehicle-icon" src="icons/truck.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Truck</span>
        </label>
        <label title="Concrete" aria-label="Concrete">
          <input type="radio" name="vehicleTypeChoice" value="concrete">
          <img class="vehicle-icon" src="icons/concrete.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Concrete</span>
        </label>
        <label title="Tanker" aria-label="Tanker">
          <input type="radio" name="vehicleTypeChoice" value="tanker">
          <img class="vehicle-icon" src="icons/tanker.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Tanker</span>
        </label>
        <label title="Pick-up" aria-label="Pick-up">
          <input type="radio" name="vehicleTypeChoice" value="pickup">
          <img class="vehicle-icon" src="icons/pickup.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Pick-up</span>
        </label>
        <label title="Bus" aria-label="Bus">
          <input type="radio" name="vehicleTypeChoice" value="bus">
          <img class="vehicle-icon" src="icons/bus.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Bus</span>
        </label>
        <label title="Mini Bus" aria-label="Mini Bus">
          <input type="radio" name="vehicleTypeChoice" value="minibus">
          <img class="vehicle-icon" src="icons/minibus.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Mini Bus</span>
        </label>
        <label title="Site Car" aria-label="Site Car">
          <input type="radio" name="vehicleTypeChoice" value="suv">
          <img class="vehicle-icon" src="icons/site-car.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Site Car</span>
        </label>
        <label title="Private Car" aria-label="Private Car">
          <input type="radio" name="vehicleTypeChoice" value="car">
          <img class="vehicle-icon" src="icons/private-car.svg" alt="" aria-hidden="true">
          <span class="vehicle-label">Private Car</span>
        </label>
      </fieldset>
    </section>






    
    <!-- START LOCATION -->
    <section class="control-section" aria-labelledby="startingHeading">
      <h2 id="startingHeading">Start Location:</h2>
      <fieldset class="radio-options start-options" aria-label="Start location">
        <legend class="visually-hidden">Start location</legend>
        <label><input type="radio" name="startModeChoice" value="live" checked> Current Location</label>
        <label><input type="radio" name="startModeChoice" value="map"> Set on Map</label>
      </fieldset>
      <input id="startMode" type="hidden" value="live">
    </section>

<!-- DESTINATION -->
    <section class="control-section" aria-labelledby="destinationHeading">
      <h2 id="destinationHeading">Destination:</h2>
      <fieldset class="radio-options start-options destination-mode-options" aria-label="Destination selection method">
        <legend class="visually-hidden">Choose destination by</legend>
        <label><input type="radio" name="destinationModeChoice" value="list" checked> Select from List</label>
        <label><input type="radio" name="destinationModeChoice" value="map"> Set on Map</label>
      </fieldset>
      <div class="destination-filter-bar">
        <label class="contractor-filter-trigger" title="Filter destinations"><input id="contractorFilterToggle" type="checkbox" disabled> Filters</label>
        <button id="contractorFilterClear" class="destination-filter-clear" type="button" disabled>Clear filters</button>
      </div>
      <div class="contractor-filter-wrap">
        <section id="contractorFilterDialog" class="contractor-filter-dialog" role="dialog" aria-label="Filter destinations" hidden>
          <div class="contractor-filter-heading">
            <strong>Filter destinations</strong>
            <button id="contractorFilterApply" type="button">Apply</button>
          </div>
          <div class="destination-filter-groups">
            <fieldset class="destination-filter-group destination-type-filter-group"><legend>Type</legend><div id="destinationTypeFilterOptions" class="contractor-filter-options"></div></fieldset>
            <fieldset class="destination-filter-group"><legend>Contractor</legend><div id="contractorFilterOptions" class="contractor-filter-options"></div></fieldset>
          </div>
        </section>
      </div>
      <button id="destinationPickerToggle" class="destination-picker-toggle" type="button" aria-expanded="false" aria-controls="destinationPickerList" disabled>Select destination…</button>
      <div id="destinationPickerList" class="destination-picker-list" role="listbox" aria-label="Available destinations" hidden></div>
      <label for="destinationSearch">Find destination</label>
      <input id="destinationSearch" type="search" placeholder="Type to search…" autocomplete="off"
        aria-describedby="searchStatus" disabled>
      <p id="searchStatus" class="field-help" aria-live="polite"></p>
      <select id="end" disabled aria-hidden="true" tabindex="-1">
        <option value="" selected>Select destination…</option>
      </select>
    </section>






    <noscript>
      <p class="setup-status">
        Enable JavaScript to use navigation.
      </p>
    </noscript>

    <footer class="sidebar-credit">
      <span>Developed by</span>
      <img src="TranspoGroup.png" alt="TranspoGroup">
      <span>for Diriyah2 SWL</span>
    </footer>
  </aside>


  <!-- MAP -->

  <main
    id="map"
    aria-label="Interactive LAAR navigation map"
  ></main>

  <!-- Live route action buttons are in the navigation panel header. -->
  <div id="journeyControls" class="journey-controls" hidden>
    <p id="journeyStage" class="journey-stage">Live Routing</p>
    <div class="journey-actions">
      <button id="startLiveRoute" type="button" class="primary-button">Start</button>
      <button id="stopLiveRoute" type="button" class="stop-routing-button" hidden>Stop</button>
    </div>
    <div id="journeyGuidance" class="journey-guidance" hidden aria-live="polite">
      <span id="journeyDirectionArrow" class="journey-direction-arrow" aria-hidden="true">↑</span>
      <span id="journeyDirectionText">Waiting for heading…</span>
    </div>
  </div>

  <script defer src="script/ui.js?v=bottom-sheet-swipe-direction-1"></script>
  <script defer src="script/main.js?v=remove-status-panels-1"></script>

</body>
</html>
